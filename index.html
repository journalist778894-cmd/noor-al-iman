<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نور الإيمان | NOOR AL-IMAN</title>
<meta name="theme-color" content="#0B3D2E">
<meta name="description" content="تطبيق إسلامي: القرآن الكريم والأذكار والمسبحة ومواقيت الصلاة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --emerald-deep:#0B3D2E; --emerald:#0F5C45; --gold:#C9A24B; --gold-soft:#E3C879; --ink:#0A0F0D;
  --bg:#F6F1E3; --surface:#FFFDF6; --text:#0B2A20; --muted:#52665D; --line:#DCD2B4; --accent:#0F5C45; --on-accent:#F6F1E3;
  --serif:'Amiri','Traditional Arabic',serif; --sans:'Tajawal','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0F0D; --surface:#111B17; --text:#EFE8D2; --muted:#9DB0A6; --line:#23362E; --accent:#C9A24B; --on-accent:#0A0F0D;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.7;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--emerald-deep);color:#F6F1E3;padding:18px 20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:3px solid var(--gold)}
.brand h1{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1.2;color:var(--gold-soft)}
.brand span{font-size:.8rem;letter-spacing:.14em;color:#B9CBC1}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold-soft);display:grid;place-items:center;font-size:1.2rem}

main{flex:1;padding:22px 20px 32px}
.view{display:none}.view.active{display:block}

.bismillah{font-family:var(--serif);font-size:2.1rem;line-height:2;text-align:center;color:var(--accent);padding:10px 0 22px}
.date{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;text-align:center}
.date .hijri{font-family:var(--serif);font-size:1.9rem;font-weight:700;color:var(--text)}
.date .greg{color:var(--muted);font-size:.95rem}

.status{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.status li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#2E9E6B}.dot.warn{background:var(--gold)}
.primary{display:block;width:100%;margin-top:18px;background:var(--accent);color:var(--on-accent);padding:14px;border-radius:12px;font-weight:700}
.note{margin-top:14px;color:var(--muted);font-size:.92rem}

nav{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--gold);display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.show{display:flex}
nav a{flex:1;text-align:center;padding:10px 4px;text-decoration:none;color:var(--muted);font-size:.85rem}
nav a[aria-current="page"]{color:var(--accent);font-weight:700}
nav a b{display:block;font-size:1.3rem;font-weight:400}

@media (prefers-reduced-motion:no-preference){ .bismillah{animation:fade 1.2s ease both} }
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>نور الإيمان</h1><span>NOOR AL-IMAN</span></div>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي والنهاري">◐</button>
  </header>

  <main id="views">
    <section class="view" id="view-home" data-title="الرئيسية">
      <p class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
      <div class="date">
        <div class="hijri" id="hijri"></div>
        <div class="greg" id="greg"></div>
      </div>
      <ul class="status">
        <li><span class="dot" id="offDot"></span><span id="offText">جارٍ التحقق من العمل بدون إنترنت…</span></li>
        <li><span class="dot" id="netDot"></span><span id="netText"></span></li>
      </ul>
      <button class="primary" id="installBtn" hidden>تثبيت التطبيق على الهاتف</button>
      <p class="note" id="iosNote" hidden>على آيفون: اضغط زر المشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية».</p>
    </section>
  </main>

  <nav id="nav" aria-label="التنقل الرئيسي"></nav>
</div>

<script>
const MODULES = [
  { id:'home', title:'الرئيسية', icon:'☪' }
];

const store = {
  get(k, d=null){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const root = document.documentElement;
const meta = document.querySelector('meta[name="theme-color"]');
function applyTheme(t){
  root.dataset.theme = t;
  meta.content = t === 'dark' ? '#0A0F0D' : '#0B3D2E';
}
applyTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.getElementById('themeBtn').onclick = () => {
  const t = root.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
};

const nav = document.getElementById('nav');
nav.innerHTML = MODULES.map(m =>
  `<a href="#/${m.id}" data-id="${m.id}"><b aria-hidden="true">${m.icon}</b>${m.title}</a>`).join('');
nav.classList.toggle('show', MODULES.length > 1);

function route(){
  const id = (location.hash.replace('#/','') || 'home');
  const target = MODULES.some(m => m.id === id) ? id : 'home';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + target));
  nav.querySelectorAll('a').forEach(a => {
    if(a.dataset.id === target) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  scrollTo(0,0);
}
addEventListener('hashchange', route); route();

function renderDates(){
  const now = new Date();
  try{
    document.getElementById('hijri').textContent =
      new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab', {day:'numeric', month:'long', year:'numeric'}).format(now);
  }catch(e){ document.getElementById('hijri').textContent = ''; }
  document.getElementById('greg').textContent =
    new Intl.DateTimeFormat('ar-EG', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(now);
}
renderDates();

function renderNet(){
  const on = navigator.onLine;
  document.getElementById('netDot').className = 'dot ' + (on ? 'ok' : 'warn');
  document.getElementById('netText').textContent = on ? 'متصل بالإنترنت' : 'غير متصل، التطبيق يعمل من الذاكرة';
}
addEventListener('online', renderNet); addEventListener('offline', renderNet); renderNet();

const offDot = document.getElementById('offDot'), offText = document.getElementById('offText');
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    offDot.className = 'dot ok'; offText.textContent = 'جاهز للعمل بدون إنترنت';
  }).catch(() => { offDot.className = 'dot warn'; offText.textContent = 'تعذر تفعيل العمل بدون إنترنت على هذا المتصفح'; });
} else { offDot.className = 'dot warn'; offText.textContent = 'هذا المتصفح لا يدعم العمل بدون إنترنت'; }

let deferred;
const installBtn = document.getElementById('installBtn');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; installBtn.hidden = false; });
installBtn.onclick = async () => { if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.hidden = true; };
addEventListener('appinstalled', () => { installBtn.hidden = true; });
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIOS && !standalone) document.getElementById('iosNote').hidden = false;
</script>
</body>
</html>
